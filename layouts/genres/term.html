{{ define "main" }}
<p class="breadcrumb"><a href="{{ "/genres/" | relURL }}">← Genres</a></p>
{{ partial "page-header.html" . }}
<p class="muted">{{ len .RegularPages }} recordings</p>
<div class="prose">{{ .Content }}</div>
<h2>Recordings</h2>
{{ partial "set-list.html" (dict "page" . "sets" .RegularPages.ByDate.Reverse) }}
{{ with .OutputFormats.Get "RSS" }}<p><a href="{{ .RelPermalink }}">Genre RSS</a></p>{{ end }}
{{ end }}
