<div class="card-grid">
  {{ range . }}
    {{ $page := . }}
    {{ $cover := .Resources.GetMatch "cover.*" }}
    <a href="{{ .Permalink }}" class="card">
      <div class="card-image-box{{ if eq $page.Params.coverStyle "logo" }} card-image-box--logo{{ end }}">
        {{ with $cover }}
          {{ if eq $page.Params.coverStyle "logo" }}
            <img src="{{ .RelPermalink }}" alt="" class="card-img-contain">
          {{ else }}
            <img src="{{ .RelPermalink }}" alt="" class="card-img-cover">
          {{ end }}
        {{ else }}
          <div class="card-fallback"></div>
        {{ end }}
      </div>
      <span class="card-caption">{{ .Title }}</span>
    </a>
  {{ end }}
</div>
