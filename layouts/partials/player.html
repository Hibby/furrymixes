{{ $embed := partial "embed-data.html" . }}
{{ if $embed.url }}
<iframe class="embedded-player" width="100%" height="{{ $embed.height }}" src="{{ $embed.url | safeURL }}" title="{{ $embed.platform }} player: {{ partial "set-title.html" . | plainify }}" loading="lazy" allow="encrypted-media; fullscreen; autoplay" allowfullscreen></iframe>
<p><a href="{{ $embed.source }}">Open on {{ $embed.platform }} ↗</a></p>
{{ else }}{{ with .Params.embed.url }}<p><a href="{{ . }}">Listen to the original recording ↗</a></p>{{ end }}{{ end }}
