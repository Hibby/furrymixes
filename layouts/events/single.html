{{ define "main" }}
<p class="breadcrumb">
  <a href="{{ "/events/" | relURL }}">Events</a> /
  <a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a>
</p>
<article class="recording">
  <header>
    <p class="eyebrow">From the archive</p>
    <h1>{{ partial "set-title.html" . }}</h1>
  </header>
  <div class="recording-overview">
    {{ partial "set-cover.html" . }}
    <div>
      {{ partial "set-meta.html" . }}
      <p>Listen here, or open the original recording below.</p>
    </div>
  </div>
  {{ partial "player.html" . }}
  <div class="prose recording-content">{{ .Content }}</div>
</article>
{{ end }}
